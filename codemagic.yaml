workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.0
      xcode: latest
      cocoapods: default
    scripts:
      # Flutter 3.22+ uses Swift Package Manager by default, which breaks
      # project.pbxproj during `flutter pub get` on CI. Force CocoaPods instead.
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (sin firma — añade code signing para App Store)
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app
      - flutter_drive.log

  # Para distribuir en TestFlight / App Store añade aquí tu workflow con
  # code signing: https://docs.codemagic.io/yaml-code-signing/signing-ios/
